<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enseignements SFU — Cours</title>
  <link rel="stylesheet" href="stylesSfu.css" />
</head>

<body>
  <div class="layout accueilPanel">

    <header class="header">
      <div class="headerPane">
        <div class="lblNom">
          <span class="lblNom-principal">Philippe Spoljar</span>
          <span class="lblNom-secondaire">Enseignements 2026-2027</span>
        </div>
      </div>
    </header>

    <aside class="west">
      <nav class="verticalMainPanel" aria-label="Menu des enseignements">
        <a class="btMenusPages" href="index.html">Accueil</a>

        <a class="btMenusPages" href="pageMaitre.html?page=pages/bs6.html">
          BS6 - Psychopathologie
        </a>

        <a class="btMenusPages" href="pageMaitre.html?page=pages/ms3.html">
          MS3 - Clinique et psychopathologie phénoménologique
        </a>

        <a class="btMenusPages" href="pageMaitre.html?page=pages/docs.html">
          Documents Phénoménologie
        </a>
      </nav>
    </aside>

    <main class="center">
      <div class="htmlPresentation">
        <iframe
          id="coursFrame"
          class="htmlPresentation-frame"
          src="pages/bs6.html"
          title="Contenu du cours"
        ></iframe>

        <noscript>
          Activez JavaScript pour afficher le contenu du cours automatiquement.
        </noscript>
      </div>
    </main>

    <footer class="footer">
      <div class="footerPanel">
        <div class="lblAdresse">mail : philippe.spoljar@u-picardie.fr</div>
      </div>
    </footer>

  </div>

  <script>
    (function () {
      const pagesAutorisees = new Set(["pages/bs6.html", "pages/ms3.html", "pages/docs.html"]);
      const params = new URLSearchParams(window.location.search);
      const page = params.get("page") || "pages/bs6.html";

      document.getElementById("coursFrame").src = pagesAutorisees.has(page)
        ? page
        : "pages/bs6.html";
    })();
  </script>
</body>
</html>
